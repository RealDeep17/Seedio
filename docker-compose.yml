version: "3.8"

services:
  mongodb:
    image: mongo:5.0
    container_name: seedio_mongodb
    ports:
      - 127.0.0.1:${MONGO_HOST_PORT_MAP:-27017}:27017
    env_file:
      - ./.env
    volumes:
      - ./volumes/mongodb:/data/db
    restart: always
    networks:
      - seedio_network

  redis:
    image: redis:6.2-alpine
    container_name: seedio_redis
    command: redis-server --save 20 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    env_file:
      - ./.env
    volumes:
      - ./volumes/redis:/data
    restart: always
    networks:
      - seedio_network

  tor:
    image: dockage/tor-privoxy:latest
    container_name: seedio_tor
    restart: always
    ports:
      - 127.0.0.1:${TOR_HOST_PORT_MAP:-9050}:9050
    networks:
      - seedio_network

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: seedio_flaresolverr
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - CAPTCHA_SOLVER=none
    restart: always
    networks:
      - seedio_network

  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: seedio_jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - AUTO_UPDATE=true
    volumes:
      - ./api/jackett/config:/config
    restart: always
    depends_on:
      - api
    ports:
      - 127.0.0.1:${JACKETT_HOST_PORT_MAP:-9117}:9117
    networks:
      - seedio_network

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: seedio_api
    container_name: seedio_api
    ports:
      - 6881:6881
      - 6881:6881/udp
    environment:
      - API_DEBUG=False
    env_file:
      - ./.env
    volumes:
      # - ./api:/app
      - ${DOWNLOADS_PATH:-./volumes/downloads}:/downloads
    restart: always
    depends_on:
      - redis
      - mongodb
    networks:
      - seedio_network

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.prod
    image: seedio_ui
    container_name: seedio_ui
    env_file:
      - ./.env
    environment:
      - BUILD_ENV=prod
    # volumes:
    #   - ./ui:/app
    restart: always
    depends_on:
      - api
    networks:
      - seedio_network

  proxy:
    image: nginx:1.19-alpine
    container_name: seedio_proxy
    environment:
      - API_ADDRESS=api:8080
      - UI_ADDRESS=ui:3000
    env_file:
      - ./.env
    ports:
      - 127.0.0.1:${APP_HTTP_PORT}:80
      - 127.0.0.1:${APP_HTTPS_PORT}:443
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/templates/default.conf.template
      - ./proxy/certificate/server.crt:/etc/ssl/certs/server.crt
      - ./proxy/certificate/server.key:/etc/ssl/certs/server.key
    restart: always
    depends_on:
      - api
      - ui
    networks:
      - seedio_network

networks:
  seedio_network:
    name: seedio_network
